#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-plugin
  - git
  - ufw

runcmd:
  # let Docker start on boot
  - systemctl enable --now docker

  # allow common ports (adjust as needed)
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8069/tcp      # Odoo (if you expose it)
  - ufw allow 8080/tcp      # cAdvisor (optional)
  - ufw --force enable

  # put the default user (Ubuntu images use 'ubuntu') into the docker group
  - usermod -aG docker ubuntu
