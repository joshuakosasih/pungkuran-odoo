version: "3.9"
services:
  db:
    image: postgres:15-alpine
    platform: linux/arm64
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8069:8069"
    env_file: .env
    volumes:
      - ./addons:/opt/odoo/addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf.template:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    platform: linux/arm64
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    platform: linux/arm64
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  db_data: