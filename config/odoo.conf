[options]
; Database connection
db_host = db
db_port = 5432
db_user = $POSTGRES_USER
db_password = $POSTGRES_PASSWORD
db_name = $POSTGRES_DB

; HTTP server
xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069

; Addons paths
addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons

; Admin password
admin_passwd = $ODOO_ADMIN_PASS

dbfilter = .*

; Logging
log_level = info
log_handler = :INFO
; logfile = /var/log/odoo/odoo.log

; Resource limits
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120